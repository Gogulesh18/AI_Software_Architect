[project]
name = "ai-software-architect-backend"
version = "0.1.0"
description = "Backend for the AI Software Architect platform: repo ingestion, parsing, knowledge graph, architecture analysis, diagrams, and RAG."
requires-python = ">=3.11"
readme = "../README.md"

dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",   # ZIP / file upload support

    # Persistence
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Ingestion
    "gitpython>=3.1",

    # Parsing
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",

    # Knowledge graph
    "networkx>=3.4",

    # RAG / embeddings / vector store
    "chromadb>=0.5",
    "fastembed>=0.4",             # local ONNX embeddings, no torch/GPU required

    # LLM (default provider)
    "anthropic>=0.39",

    # Export
    "fpdf2>=2.8",                 # pure-Python PDF generation, no system deps

    # Misc
    "httpx>=0.27",
]

[project.optional-dependencies]
# Production job runner + Postgres, only needed when running docker-compose.yml's prod mode.
prod = [
    "celery>=5.4",
    "redis>=5.1",
    "psycopg[binary]>=3.2",
]
# Optional second LLM provider, wired behind the same app/llm interface.
openai = [
    "openai>=1.54",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (function-call-in-default-argument) flags FastAPI's idiomatic
# `Depends(...)` default-argument pattern used in every route handler —
# a well-known false positive, not something to work around per-call-site.
ignore = ["B008"]

[tool.mypy]
# Newer than requires-python's ">=3.11" floor: numpy's bundled stubs (pulled
# in transitively via chromadb/fastembed) use PEP 695 `type` statements that
# need 3.12+ to even parse, regardless of what version the app itself targets.
python_version = "3.12"
ignore_missing_imports = true
